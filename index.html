<!DOCTYPE html>
<html lang="en" >

<head>
  
  <meta charset="UTF-8">
  
  
  

  <title>pizza home page</title>

    <link rel="canonical" href="https://codepen.io/rustudent/pen/JoNaGRW">
  
  
  
  
<style>
/* load icon font from google */
/* so you can use icons like special characters */
/* @import statement MUST be before other CSS statement */
@import url("https://fonts.googleapis.com/icon?family=Material+Icons");

/* reset default */
* {
  margin: 0;
  padding: 0;
/* redefine width to include padding and border, instead of only content area   */
  box-sizing: border-box;
}

.header {
  /* TODO make header occupy the whole row with display block */
  display: block;
  /* TODO make width 100% */
  width: 100%;
  /* TODO text align right   */
  text-align: right;
  /* rgba function for red/green/blue/transparency   */
  background-color: rgba(100,0,0,0.8);  
}

/* for simplicity, we ignore search for this exercise */
.header > .search {
  /* TODO use display none to hide search module */
  display: none;
}

/* IMPORTANT: multiple selector statements separated by comma */
/* It is equivalent to have each separately with same {} body */
/* hide checkbox and label */
.header > input, 
.header > label 
{
  /* TODO use display none to hide */
  display: none;
}

.header > .nav {
  /* TODO make navbar display inline-block */
  display: inline-block;
  /* TODO make width 100%   */
  width: 100%;
  /* TODO make padding 16px */
  padding: 16px;
}

.header > .nav > .quick-access {
  /* TODO make user-group links and quick-access links share with row using inline-block  */
  display: inline-block;
  /* TODO make quick-access width 30% */
  width: 30%;
  /* TODO text align left   */
  text-align: left;
}

.header > .nav > .user-group {
  /* TODO make user-group links and quick-access links share with row using inline-block  */
  display: inline-block;
  /* TODO make user-group width 68% */
  width: 68%;
  /* TODO align text to right   */
  text-align: right;
}

.header > .nav > .quick-access > li, 
.header > .nav > .user-group > li 
{
  /* TODO make links side by side using inline-block */
  display: inline-block;
  /* TODO make left/right padding 4px */
  padding: 0 4px;
}

.header > .nav > .quick-access > li > a, 
.header > .nav > .user-group > li > a 
{
  /* TODO make all text color white */
  color: white;
  /* TODO set font type sans-serif */
  font-family: sans-serif;
  /* TODO set font size smaller 75% */
  font-size: 75%;
  /* TODO set texts to be uppercase */
  text-transform: uppercase;
  /* TODO remove underline */
  text-decoration: none;
}

/* add code for screen less than 700px */
@media (max-width: 700px) {
  
  .header > #nav + label + .nav {
    /* TODO hide the navbar when checkbox is unchekced, using display: none */
    display: none;
    /* TODO set width 320px and padding 16px   */
    width: 320px;
    padding: 16px;
    
    background-color: lightgrey;
  }

  /* the key here is the :checked selector which only select checkbox when it is checked */
  .header > #nav:checked + label + .nav {
    /* TODO show navbar when checkbox is checked, using display: block */
    display: block;
  }

  /* use bottom border to implement the seperator line */
  .header > .nav > .quick-access {
    /* TODO user-group does not share row with anyone, using display: block   */
    display: block;
    /* TODO set its width 100%   */ 
    width: 100%;
    /* TODO align text on the center   */
    text-align: center;
    
    /* use border as separator line */
    border: 1px dotted grey;
  /* only render bottom border by setting border-width: 0 for all other sides   */
    border-width: 0 0 1px 0;
  }

  .header > .nav > .quick-access > li {
    /* TODO place quick-acess links horizontally, using display: inline-block */
    display: inline-block;
    /* TODO add margin top/right/bottom/left with 0/4px/16px/4px */
    margin: 0 4px 16px 4px;
  }

  .header > .nav > .user-group {
    /* TODO user-group does not share row with anyone, using display: block   */
    display: block;
    /* TODO set its width 100%   */
    width: 100%;
    /* TODO align text on the left   */
    text-align: left;
  }

  .header > .nav > .user-group > li {
    /* TODO place user-group links vertically, using display: block */
    display: block;
    /* TODO add margin top/right/bottom/left with 16px/4px/0/12px */
    margin: 16px 4px 0 12px;
    /* TODO make font larger 130%    */
    font-size: 130%;
  }  

  /* TODO dropdown overlap other content. Use position   */
  .header > .nav {
    /* TODO position absolute */
    position: absolute;
    /* TODO top/right as 48px/0     */
    top: 48px;
    right: 0;
    /* TODO z-index 100     */
    z-index: 100;
    /* TODO text align to left */
    text-align: left;
  }   

  /* make label as icon   */
  .header > label {
    display: inline-block;
    width: 48px;
    height: 48px;
    padding: 16px;

    color: white;
  }

  /* change text color to be black   */
  .header > .nav > .quick-access > li > a,
  .header > .nav > .user-group > li > a 
  {
    color: black;
  }
}

/* rset defaults */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.slideshow {
/* TODO set the whole slidshow as a block */
  display: block;
/* TODO set it as 100% wide and 840px high   */
  width: 100%;
  height: 840px;
/* TODO use "position: relative" to choose slideshow tag as coordinate origin for labels so they can be positioned on top of slide  */
  position: relative;
/* hide anything beyond the border */
  overflow: hidden;
}

.slide {
/* TODO hide all slides using display: none   */
  display: none;
/* TODO set 100% wide and 100% high for each slide   */
  width: 100%;
  height: 100%;
/* hide anything beyond the border   */
  overflow: hidden;
}

.slideshow > input {
/* TODO hide radio button, instead we will use label to check/uncheck it, using display: none; */
  display: none;
}

.slideshow > input:checked + label + .slide {
/* TODO only show slide if the radio button in front of it is checked, using :checked selector and display: block; */
  display: block;
}

.slideshow > label {
/* TODO use display: inline-block so labels will be side by side and share the row   */
  display: inline-block;
/* TODO set width and height to be 8px so it looks like a small square button   */
  width: 16px;
  height: 16px;
  border-radius: 50%;
/* TODO set label position: absolute and use bottome: 140px so they will be placed on top of slides at the bottom part of slideshow  */
  position: absolute;
  bottom: 140px;
/* TODO set z-index: 100, so it will be on top of the slides instead of behind them   */
  z-index: 100;
/* make button lightgrey even it has no text content   */
  background-color: lightgrey;
}

/* highlight checked button */
.slideshow > input:checked + label {
  background-color: white;
}

/* set differnt left: value to make labels position horizontally */
.slideshow > label:nth-of-type(1) {
  left: 60px;
}
.slideshow > label:nth-of-type(2) {
/* TODO set a differnt left value */
  left: 90px;
}
.slideshow > label:nth-of-type(3) {
/* TODO set a differnt left value */
  left: 120px;
}

/* set video and img inside of slideshow to be 100% high of its parent and hide anything outside of its border */
.slide video, .slide img {
  height: 100%;
  overflow: hidden;
}

.slide > span {
/* TODO set title to be 300px wide   */
  width: 300px;
/* TODO use absolute position to place title text 440px from bottom and 60px from left   */
  position: absolute;
  bottom: 440px;
  left: 60px;
/* set text color and font size   */
  color: white;
  font-size: 280%;
}

/* make the link as a square box */
.slide > a {
/* TODO set display: block;   */
  display: block;
/* TODO make it 104px wide and high   */
  width: 124px;
  height: 124px;
/* TODO make 14px padding   */
  padding: 14px;
/* TODO add 5px solid white border   */
  border: 5px solid white;
/* TODO use absolute position to place it 220px from bottom and 60px from left   */
  position: absolute;
  bottom: 220px;
  left: 60px;
/* set font and text style   */
  color: white;
  font-family: sans-serif;
  font-size: 120%;
  text-decoration: none;
}
</style>

  
  
  
</head>

<body>
  <div class="header">
  <!-- add checkbox and label to hide/show navbar -->
  <input type="checkbox" id="nav" />
  <label for="nav" class="material-icons">dehaze</label>

  <div class="nav">
    
    <ul class="user-group">
      <li>
        <a href="https://comminfo.rutgers.edu/prospective-students">Home</a>
      </li>
      <li>
        <a href="https://comminfo.rutgers.edu/current-students">Menu</a>
      </li>
      <li>
        <a href="https://comminfo.rutgers.edu/lifelong-learners">Contact</a>
      </li>
    </ul>
    
  </div>
  <form class="search" action="https://comminfo.rutgers.edu/search/site" method="get">
    <input type="text" name="keys">
  </form>  
</div>

<div class="slideshow">
  
  <!-- slide one, we add radio button and label in front of each slide to hide and show slide one at a time   -->
  <input type="radio" checked id="s1" name="slide" />
  <label for="s1"></label>
  <div class="slide">
    <span>Welcome!</span>
    <a href="https://www.youtube.com/embed/_8HxXDIt7Sg?rel=0&" target="_blank">More about our pizza.</a>
    <img src="https://kotanyi-en.imgix.net/wp-content/uploads/2026/01/Heart-Shaped-Margherita-Pizza-1.jpg?auto=format,compress" alt="pizza">
  </div>

  <!-- slide #2 -->
  <input type="radio" id="s2" name="slide" />
  <label for="s2"></label>
  <div class="slide">
    <span>Rutgers 250</span>
    <a href="https://250.rutgers.edu/" target="_blank">Learn more about Rutgers</a>
    <img src="https://ucmweb.rutgers.edu/250/sites/default/files/R250_Event_Montage_hp.jpg.jfif" alt="ru 250" />
  </div>

  <!-- slide #3 -->
  <input type="radio" id="s3" name="slide" />
  <label for="s3"></label>
  <div class="slide">
    <span>ITI Showcase</span>
    <a href="https://comminfo.rutgers.edu/news/students-fall-2019-it-informatics-showcase-pitched-40-new-prototypes-designed-solve-real-world-problems">Join the fun</a>
    <img src="https://comminfo.rutgers.edu/sites/default/files/styles/news_detail/public/2020-01/ITIbanner.jpg?h=87a066a7&itok=M7KNyvGs" alt="showcase" />
  </div>

</div>
  
  
  
</body>

</html>
